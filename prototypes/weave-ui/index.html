<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether · Weave playground</title><link rel="stylesheet" href="style.css"></head>
<body><div class="experiment"><span>WEAVE / DESIGN STUDY</span><nav aria-label="Concept"><button data-concept="a" aria-pressed="true">A · Scene cards</button><button data-concept="b" aria-pressed="false">B · Mini strips</button><button data-concept="c" aria-pressed="false">C · Weave spine</button></nav><label>Scenes <select id="count"><option>1</option><option selected>4</option><option>12</option></select></label><button id="theme">Dark / light</button><span class="quiet">Visual prototype · no audio</span></div>
<div class="app"><header><strong class="brand">aether</strong><span class="transport">▶ &nbsp; ■ &nbsp; · &nbsp; 120 BPM &nbsp; 4/4</span><div class="channels" aria-label="Channel overlays"></div><button id="capture">＋ Capture Scene</button><span class="quiet">MASTER ───●─</span></header>
<main><section class="side left" aria-label="Weave"><div class="section-head"><span>WEAVE</span><span id="total"></span></div><div id="scenes" class="a"></div><div id="editor"></div><div class="overlays" id="left-overlays"></div></section>
<section class="arena" aria-label="Current Aether sound space"><div class="canvas-label">2D &nbsp; / &nbsp; CURRENT SOUND SPACE</div><div class="axis horizontal"></div><div class="axis vertical"></div><span class="axis-label top">VOLUME +</span><span class="axis-label bottom">− &nbsp; PAN &nbsp; +</span><svg viewBox="0 0 912 760" aria-hidden="true"><path d="M215 260 C310 120 480 160 535 280 S690 450 610 520"/><path d="M290 510 C370 560 515 530 550 420"/></svg><button class="node n1" data-track="0" aria-label="Open channel 1">1</button><button class="node n2" data-track="1" aria-label="Open channel 2">2</button><button class="node n3" data-track="2" aria-label="Open channel 3">3</button><button class="node n4" data-track="3" aria-label="Open channel 4">4</button><div class="canvas-foot">Click a node to open its channel &nbsp; · &nbsp; Scenes are imagined snapshots</div></section>
<section class="side right" aria-label="Transition"><div class="section-head"><span>TRANSITION</span><span>STUDY</span></div><div id="transition"></div><div class="overlays" id="right-overlays"></div></section></main><footer><span id="description"></span><span id="status" role="status">Select a Scene to explore its transition.</span></footer></div><script src="app.js"></script></body></html>
