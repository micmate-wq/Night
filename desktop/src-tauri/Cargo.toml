[package]
name = "aether-desktop"
version = "4.0.0"
description = "Aether Desktop — Standalone 4-Track Spatial Audio Studio & Motion Automation Workstation"
authors = [""]
edition = "2021"

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
