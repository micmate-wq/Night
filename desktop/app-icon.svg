<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="agyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="codexGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sleek Dark Squircle Base -->
  <rect width="512" height="512" rx="128" fill="#0d0e15"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#232738" stroke-width="3"/>
  
  <!-- Outer Antigravity Cross-Orbit Ring (Cyan-Blue) -->
  <ellipse cx="256" cy="256" rx="192" ry="96" transform="rotate(-32 256 256)" fill="none" stroke="url(#agyGradient)" stroke-width="18" opacity="0.85"/>
  <circle cx="395" cy="170" r="14" fill="#00f5d4"/>
  <circle cx="395" cy="170" r="7" fill="#ffffff"/>

  <!-- Codex / Aether Concentric Rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#codexGradient)" stroke-width="16" opacity="0.45"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#8b5cf6" stroke-width="20" opacity="0.8"/>
  
  <!-- Glowing Hybrid Core -->
  <circle cx="256" cy="256" r="62" fill="url(#codexGradient)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
  <circle cx="256" cy="256" r="14" fill="#00f5d4"/>
</svg>
