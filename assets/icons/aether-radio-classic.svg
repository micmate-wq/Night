<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#subtle-shadow)">
    <!-- Antenna -->
    <line x1="170" y1="165" x2="380" y2="70" stroke="#111111" stroke-width="24" stroke-linecap="round"/>
    <circle cx="385" cy="68" r="14" fill="#111111"/>

    <!-- Radio Body Outer Chassis -->
    <rect x="76" y="160" width="360" height="260" rx="44" ry="44" fill="none" stroke="#111111" stroke-width="26" stroke-linejoin="round"/>

    <!-- Speaker / Tuner Left Dial -->
    <circle cx="190" cy="290" r="66" fill="none" stroke="#111111" stroke-width="22"/>
    <circle cx="190" cy="290" r="28" fill="#111111"/>

    <!-- Right Acoustic Grille Slots / Vertical Pills -->
    <line x1="325" y1="235" x2="325" y2="255" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
    <line x1="325" y1="280" x2="325" y2="300" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
    <line x1="325" y1="325" x2="325" y2="345" stroke="#111111" stroke-width="20" stroke-linecap="round"/>

    <line x1="375" y1="235" x2="375" y2="255" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
    <line x1="375" y1="280" x2="375" y2="300" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
    <line x1="375" y1="325" x2="375" y2="345" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
