<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#subtle-shadow)">
    <!-- Antenna -->
    <line x1="170" y1="165" x2="380" y2="70" stroke="#111111" stroke-width="24" stroke-linecap="round"/>
    <circle cx="385" cy="68" r="14" fill="#111111"/>

    <!-- Radio Body Outer Chassis -->
    <rect x="76" y="160" width="360" height="260" rx="44" ry="44" fill="none" stroke="#111111" stroke-width="26" stroke-linejoin="round"/>

    <!-- Dual Synthesizer / Preset Knobs -->
    <circle cx="180" cy="290" r="54" fill="none" stroke="#111111" stroke-width="20"/>
    <circle cx="180" cy="290" r="22" fill="#111111"/>
    <!-- Knob Marker -->
    <line x1="180" y1="236" x2="180" y2="252" stroke="#111111" stroke-width="12" stroke-linecap="round"/>

    <circle cx="325" cy="290" r="54" fill="none" stroke="#111111" stroke-width="20"/>
    <circle cx="325" cy="290" r="22" fill="#111111"/>
    <line x1="325" y1="236" x2="325" y2="252" stroke="#111111" stroke-width="12" stroke-linecap="round"/>

    <!-- Preset Slot / Wave indicator on top -->
    <line x1="130" y1="205" x2="382" y2="205" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
