<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tick Tok</title>
  <style>
    :root {
      --bg: var(--aether-bg, var(--bg-main, #0A0A0A));
      --panel: var(--aether-panel, var(--bg-card, #141414));
      --accent: var(--track-color, var(--aether-accent, #FFFFFF));
      --text: var(--aether-text, var(--text-main, #FFFFFF));
      --muted: var(--aether-text-muted, var(--text-muted, #888));
      --border: var(--aether-border, var(--border-light, #333));
      --font-h: var(--aether-font-heading, 'Space Grotesk', sans-serif);
      --font-m: var(--aether-font-mono, 'JetBrains Mono', monospace);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-h); font-size: 11px;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    header {
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    .badge { font-family: var(--font-m); font-size: 9px; opacity: 0.6; letter-spacing: 0.08em; }
    .steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; padding: 10px 12px; align-items: end; }
    .dot { height: 10px; border-radius: 1px; background: rgba(255,255,255,0.08); }
    .dot.on { background: var(--accent); opacity: 0.85; height: 10px; }
    .dot.talk { background: var(--accent); opacity: 0.55; height: 6px; }
    .dot.on.talk { opacity: 0.85; height: 10px; }
    .dot.now { box-shadow: 0 0 8px var(--accent); opacity: 1; }
    .grid { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .val { font-family: var(--font-m); color: var(--text); }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #222; border: 1px solid var(--border); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="title">Tick Tok</div>
    <div class="badge" id="bpm-badge">120 BPM</div>
  </header>
  <div class="steps" id="steps"></div>
  <div class="grid">
    <label><div class="row"><span>BPM</span><span class="val" id="v-bpm">120</span></div>
      <input id="bpm" type="range" min="60" max="180" step="1" value="120"></label>
    <label><div class="row"><span>Pattern</span><span class="val" id="v-pattern">0.22</span></div>
      <input id="pattern" type="range" min="0" max="1" step="0.01" value="0.22"></label>
    <label><div class="row"><span>Talk</span><span class="val" id="v-talk">0.62</span></div>
      <input id="talk" type="range" min="0" max="1" step="0.01" value="0.62"></label>
    <label><div class="row"><span>Decay</span><span class="val" id="v-decay">0.38</span></div>
      <input id="decay" type="range" min="0" max="1" step="0.01" value="0.38"></label>
    <label><div class="row"><span>Density</span><span class="val" id="v-density">0.50</span></div>
      <input id="density" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label><div class="row"><span>Lock</span><span class="val" id="v-lock">0.70</span></div>
      <input id="lock" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    <label><div class="row"><span>Color</span><span class="val" id="v-color">0.40</span></div>
      <input id="color" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  </div>
  <script>
    const P_LANDMARKS = [
      0b1000100010001000, // four on the 16ths (1,5,9,13)
      0b1100100010001000, // double kick on 1
      0b1000000010001000, // gap (skip the 5)
      0b1110000010000000, // three in a row then space
      0b1001001000100100  // clave / uneven
    ];
    const TALK_EXTRAS = [
      0b0000000000000000,
      0b0000001000000000, // 7
      0b0000001000100000, // 7 + 11
      0b0000001000100010  // 7 + 11 + 15
    ];

    function blendPattern(pattern) {
      const N = P_LANDMARKS.length;
      const f = Math.max(0, Math.min(1, pattern)) * (N - 1);
      if (f >= N - 1) return P_LANDMARKS[N - 1];
      const i = Math.floor(f);
      const t = f - i;
      if (t < 0.18) return P_LANDMARKS[i];
      if (t > 0.82) return P_LANDMARKS[i + 1];
      return P_LANDMARKS[i] | P_LANDMARKS[i + 1];
    }

    function talkMask(talk, pattern) {
      if (talk < 0.06) return 0;
      let m = 0b0000100000001000; // classic snare 5 and 13
      const N = TALK_EXTRAS.length;
      const climb = talk * 0.65 + pattern * 0.35;
      const u = Math.max(0, Math.min(1, (climb - 0.55) / 0.45));
      const f = u * (N - 1);
      if (f >= N - 1) m |= TALK_EXTRAS[N - 1];
      else {
        const i = Math.floor(f);
        const t = f - i;
        if (t < 0.18) m |= TALK_EXTRAS[i];
        else if (t > 0.82) m |= TALK_EXTRAS[i + 1];
        else m |= TALK_EXTRAS[i] | TALK_EXTRAS[i + 1];
      }
      return m;
    }

    const stepsEl = document.getElementById('steps');
    const dots = [];
    for (let i = 0; i < 16; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      stepsEl.appendChild(d);
      dots.push(d);
    }
    const state = { bpm: 120, pattern: 0.22, talk: 0.62, decay: 0.38, density: 0.5, lock: 0.7, color: 0.4 };
    const bpmBadge = document.getElementById('bpm-badge');

    function paintDots() {
      const kick = blendPattern(state.pattern);
      const talk = talkMask(state.talk, state.pattern);
      dots.forEach((d, i) => {
        const bit = 1 << (15 - i);
        d.classList.toggle('on', !!(kick & bit));
        d.classList.toggle('talk', !!(talk & bit));
      });
    }

    function notify(id, value) {
      window.parent.postMessage({ type: 'aether:param-change', paramId: id, value: value }, '*');
    }
    function fmtVal(id, n) {
      return id === 'bpm' ? String(Math.round(n)) : n.toFixed(2);
    }
    function bind(id) {
      const el = document.getElementById(id);
      const v = document.getElementById('v-' + id);
      el.addEventListener('input', () => {
        const n = parseFloat(el.value);
        state[id] = n;
        v.textContent = fmtVal(id, n);
        if (id === 'bpm') bpmBadge.textContent = Math.round(n) + ' BPM';
        if (id === 'pattern' || id === 'talk') paintDots();
        notify(id, n);
      });
    }
    ['bpm', 'pattern', 'talk', 'decay', 'density', 'lock', 'color'].forEach(bind);

    paintDots();

    let step = 0;
    let last = performance.now();
    function loop(now) {
      const dt = 60000 / Math.max(60, state.bpm) / 4;
      if (now - last >= dt) {
        last = now;
        dots.forEach((d, i) => d.classList.toggle('now', i === step));
        step = (step + 1) & 15;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'aether:param-update') return;
      const { paramId, value } = event.data;
      if (state[paramId] === undefined) return;
      state[paramId] = value;
      const el = document.getElementById(paramId);
      const v = document.getElementById('v-' + paramId);
      if (el) el.value = value;
      if (v) v.textContent = fmtVal(paramId, Number(value));
      if (paramId === 'bpm') bpmBadge.textContent = Math.round(value) + ' BPM';
      if (paramId === 'pattern' || paramId === 'talk') paintDots();
    });
  </script>
</body>
</html>
