<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: monospace;
      background: var(--aether-panel, #181818);
      color: var(--aether-text, #e0e0e0);
      user-select: none;
    }
    .header {
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: var(--aether-accent, #888);
      margin-top: -4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">Singing Bowl Generator</div>
  
  <div class="control-group">
    <label><span>Frequency</span><span id="val-frequency">140 Hz</span></label>
    <input type="range" id="frequency" min="80" max="400" step="1" value="140">
  </div>
  
  <div class="control-group">
    <label><span>Beating</span><span id="val-beating">1.5 Hz</span></label>
    <input type="range" id="beating" min="0.1" max="4.0" step="0.1" value="1.5">
  </div>

  <div class="control-group">
    <label><span>Overtone</span><span id="val-overtone">40%</span></label>
    <input type="range" id="overtone" min="0" max="1" step="0.01" value="0.4">
  </div>

  <div class="control-group">
    <label><span>Intensity</span><span id="val-intensity">70%</span></label>
    <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.7">
  </div>

  <script>
    const params = ['frequency', 'beating', 'overtone', 'intensity'];
    
    params.forEach(id => {
      const slider = document.getElementById(id);
      const display = document.getElementById(`val-${id}`);
      
      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        
        // Update local UI
        if (id === 'frequency' || id === 'beating') display.innerText = `${val} Hz`;
        else display.innerText = `${Math.round(val * 100)}%`;
        
        // Broadcast to Aether Host
        window.parent.postMessage({
          type: 'PARAMETER_CHANGE',
          id: id,
          value: val
        }, '*');
      });
    });
  </script>
</body>
</html>
