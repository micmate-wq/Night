<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotate</title>
  <style>
    :root {
      --bg: var(--aether-bg, var(--bg-main, #0A0A0A));
      --panel: var(--aether-panel, var(--bg-card, #141414));
      --accent: var(--track-color, var(--aether-accent, #FFFFFF));
      --text: var(--aether-text, var(--text-main, #FFFFFF));
      --muted: var(--aether-text-muted, var(--text-muted, #888));
      --border: var(--aether-border, var(--border-light, #333));
      --font-h: var(--aether-font-heading, 'Space Grotesk', sans-serif);
      --font-m: var(--aether-font-mono, 'JetBrains Mono', monospace);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-h); font-size: 11px;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    header {
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    .badge { font-family: var(--font-m); font-size: 9px; opacity: 0.6; letter-spacing: 0.08em; }
    .bands { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 10px 12px 4px; align-items: end; height: 42px; }
    .bar {
      border-radius: 1px; background: rgba(255,255,255,0.08);
      min-height: 4px; transition: height 80ms linear, opacity 80ms linear;
    }
    .bar.on { background: var(--accent); opacity: 0.9; }
    .notes {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
      padding: 2px 12px 6px; font-family: var(--font-m);
      font-size: 8px; color: var(--muted); text-align: center; letter-spacing: 0.04em;
    }
    .grid { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .val { font-family: var(--font-m); color: var(--text); }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #222; border: 1px solid var(--border); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="title">Rotate</div>
    <div class="badge" id="bpm-badge">KNOB</div>
  </header>
  <div class="bands" id="bands"></div>
  <div class="notes" id="notes"></div>
  <div class="grid">
    <label><div class="row"><span>Rotate</span><span class="val" id="v-rotate">0.00</span></div>
      <input id="rotate" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><div class="row"><span>Spread</span><span class="val" id="v-spread">0.45</span></div>
      <input id="spread" type="range" min="0" max="1" step="0.01" value="0.45"></label>
    <label><div class="row"><span>Morph</span><span class="val" id="v-morph">maj7</span></div>
      <input id="morph" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    <label><div class="row"><span>Q</span><span class="val" id="v-q">0.62</span></div>
      <input id="q" type="range" min="0" max="1" step="0.01" value="0.62"></label>
  </div>
  <script>
    const QUALITIES = ['min7', 'maj7', 'sus', 'pent', 'whole'];
    const SETS = [
      [0, 3, 7, 10],
      [0, 4, 7, 11],
      [0, 2, 5, 7],
      [0, 3, 5, 7, 10],
      [0, 2, 4, 6, 8, 10]
    ];
    const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

    const bandsEl = document.getElementById('bands');
    const notesEl = document.getElementById('notes');
    const bars = [];
    const noteEls = [];
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      b.className = 'bar on';
      bandsEl.appendChild(b);
      bars.push(b);
      const n = document.createElement('div');
      notesEl.appendChild(n);
      noteEls.push(n);
    }

    const state = { rotate: 0, spread: 0.45, morph: 0.3, q: 0.62 };
    const bpmBadge = document.getElementById('bpm-badge');
    let clockSteps = 0;
    let beatPhase = 0;
    let last = performance.now();

    function liveBpm() {
      let b = 0;
      try {
        const p = window.parent && window.parent.__aetherClockBpm;
        if (p != null && Number(p) > 0) b = Number(p);
      } catch (e) {}
      if (!b) return 0;
      return Math.max(40, Math.min(240, b));
    }

    function qualityIndex(m) {
      return Math.max(0, Math.min(4, Math.round(Math.max(0, Math.min(1, m)) * 4)));
    }

    function voiceMidis() {
      const spread = Math.max(0, Math.min(1, state.spread));
      const rotate = Math.max(0, Math.min(1, state.rotate));
      const qi = qualityIndex(state.morph);
      const scale = SETS[qi];
      const n = scale.length;
      const root = 36 + Math.round((1 - spread) * 12);
      const step = 1 + Math.round(spread * 3);
      const base = Math.round(rotate * n) + clockSteps;
      const midis = [];
      for (let i = 0; i < 6; i++) {
        const deg = base + i * step;
        const oct = Math.floor(deg / n);
        const pc = scale[((deg % n) + n) % n];
        midis.push(Math.max(24, Math.min(96, root + pc + oct * 12)));
      }
      return midis;
    }

    function paintVoicing(pulse) {
      const midis = voiceMidis();
      const lo = Math.min.apply(null, midis);
      const hi = Math.max.apply(null, midis);
      const span = Math.max(1, hi - lo);
      bars.forEach((b, i) => {
        const u = (midis[i] - lo) / span;
        b.style.height = (8 + u * 28) + 'px';
        b.style.opacity = pulse && i === (clockSteps % 6) ? '1' : '0.78';
      });
      noteEls.forEach((el, i) => {
        el.textContent = NAMES[((midis[i] % 12) + 12) % 12];
      });
    }

    function paintBadge() {
      const bpm = liveBpm();
      bpmBadge.textContent = bpm ? (Math.round(bpm) + ' BPM') : 'KNOB';
    }

    function notify(id, value) {
      window.parent.postMessage({ type: 'aether:param-change', paramId: id, value: value }, '*');
    }

    function fmtVal(n) {
      return Number(n).toFixed(2);
    }

    function paintParam(id) {
      const v = document.getElementById('v-' + id);
      if (!v) return;
      if (id === 'morph') v.textContent = QUALITIES[qualityIndex(state.morph)];
      else v.textContent = fmtVal(state[id]);
    }

    function bind(id) {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        const n = parseFloat(el.value);
        state[id] = n;
        paintParam(id);
        paintVoicing(false);
        notify(id, n);
      });
    }
    ['rotate', 'spread', 'morph', 'q'].forEach(bind);
    ['rotate', 'spread', 'morph', 'q'].forEach(paintParam);
    paintVoicing(false);
    paintBadge();

    function loop(now) {
      const bpm = liveBpm();
      const dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
      last = now;
      if (bpm) {
        beatPhase += dt * bpm / 60;
        const steps = Math.floor(beatPhase / 2);
        if (steps !== clockSteps) {
          clockSteps = steps;
          paintVoicing(true);
        }
      } else if (clockSteps !== 0) {
        clockSteps = 0;
        beatPhase = 0;
        paintVoicing(false);
      }
      paintBadge();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'aether:param-update') return;
      const { paramId, value } = event.data;
      if (state[paramId] === undefined) return;
      state[paramId] = value;
      const el = document.getElementById(paramId);
      if (el) el.value = value;
      paintParam(paramId);
      paintVoicing(false);
    });
  </script>
</body>
</html>
