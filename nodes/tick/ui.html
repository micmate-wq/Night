<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tick</title>
  <style>
    :root {
      --bg: var(--aether-bg, var(--bg-main, #0A0A0A));
      --panel: var(--aether-panel, var(--bg-card, #141414));
      --accent: var(--track-color, var(--aether-accent, #FFFFFF));
      --text: var(--aether-text, var(--text-main, #FFFFFF));
      --muted: var(--aether-text-muted, var(--text-muted, #888));
      --border: var(--aether-border, var(--border-light, #333));
      --font-h: var(--aether-font-heading, 'Space Grotesk', sans-serif);
      --font-m: var(--aether-font-mono, 'JetBrains Mono', monospace);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-h); font-size: 11px;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    header {
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    .badge { font-family: var(--font-m); font-size: 9px; opacity: 0.6; letter-spacing: 0.08em; }
    .steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; padding: 10px 12px; }
    .dot { height: 10px; border-radius: 1px; background: rgba(255,255,255,0.08); }
    .dot.on { background: var(--accent); opacity: 0.85; }
    .dot.now { box-shadow: 0 0 8px var(--accent); opacity: 1; }
    .grid { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .val { font-family: var(--font-m); color: var(--text); }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #222; border: 1px solid var(--border); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="title">Tick</div>
    <div class="badge">LOCKABLE RHYTHM</div>
  </header>
  <div class="steps" id="steps"></div>
  <div class="grid">
    <label><div class="row"><span>Rate</span><span class="val" id="v-rate">108</span></div>
      <input id="rate" type="range" min="60" max="180" step="1" value="108"></label>
    <label><div class="row"><span>Density</span><span class="val" id="v-density">0.55</span></div>
      <input id="density" type="range" min="0" max="1" step="0.01" value="0.55"></label>
    <label><div class="row"><span>Lock</span><span class="val" id="v-lock">0.72</span></div>
      <input id="lock" type="range" min="0" max="1" step="0.01" value="0.72"></label>
    <label><div class="row"><span>Color</span><span class="val" id="v-color">0.42</span></div>
      <input id="color" type="range" min="0" max="1" step="0.01" value="0.42"></label>
  </div>
  <script>
    const stepsEl = document.getElementById('steps');
    const dots = [];
    for (let i = 0; i < 16; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + ((i % 4 === 0) ? ' on' : '');
      stepsEl.appendChild(d);
      dots.push(d);
    }
    const state = { rate: 108, density: 0.55, lock: 0.72, color: 0.42 };
    function notify(id, value) {
      window.parent.postMessage({ type: 'aether:param-change', paramId: id, value: value }, '*');
    }
    function bind(id, fmt) {
      const el = document.getElementById(id);
      const v = document.getElementById('v-' + id);
      el.addEventListener('input', () => {
        const n = parseFloat(el.value);
        state[id] = n;
        v.textContent = fmt(n);
        notify(id, n);
      });
    }
    bind('rate', n => String(Math.round(n)));
    bind('density', n => n.toFixed(2));
    bind('lock', n => n.toFixed(2));
    bind('color', n => n.toFixed(2));
    let step = 0;
    let last = performance.now();
    function loop(now) {
      const dt = 60000 / Math.max(60, state.rate) / 4;
      if (now - last >= dt) {
        last = now;
        dots.forEach((d, i) => d.classList.toggle('now', i === step));
        step = (step + 1) & 15;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'aether:param-update') return;
      const { paramId, value } = event.data;
      if (state[paramId] === undefined) return;
      state[paramId] = value;
      const el = document.getElementById(paramId);
      const v = document.getElementById('v-' + paramId);
      if (el) el.value = value;
      if (v) v.textContent = paramId === 'rate' ? String(Math.round(value)) : Number(value).toFixed(2);
    });
  </script>
</body>
</html>
