<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Glitch-Pond</title>
  <style id="aether-theme-sync">
    :root {
      --aether-panel: #181818;
      --aether-accent: var(--track-color, #70a5ff);
      --aether-border: rgba(255, 255, 255, 0.12);
      --aether-text: #f0f0f0;
      --aether-text-dim: #888888;
      --font-mono: 'JetBrains Mono', 'Space Mono', monospace;
      --font-heading: 'Space Grotesk', sans-serif;
    }
  </style>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--aether-panel, #181818);
      color: var(--aether-text, #f0f0f0);
      font-family: var(--font-heading, sans-serif);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--aether-border, rgba(255, 255, 255, 0.12));
      background: rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--aether-accent, #70a5ff);
    }

    /* Fixed-width status badge with zero layout shift */
    .status-badge {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      padding: 2px 8px;
      width: 68px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--aether-border, rgba(255, 255, 255, 0.12));
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--aether-text-dim, #888);
      transition: border-color 0.1s ease, background 0.1s ease, color 0.1s ease;
      flex-shrink: 0;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--aether-text-dim, #888);
      transition: background 0.1s ease, box-shadow 0.1s ease;
      flex-shrink: 0;
    }

    .status-badge.hit {
      border-color: var(--aether-accent, #70a5ff);
      background: rgba(255, 255, 255, 0.12);
      color: var(--aether-accent, #70a5ff);
    }

    .status-badge.hit .status-dot {
      background: var(--aether-accent, #70a5ff);
      box-shadow: 0 0 6px var(--aether-accent, #70a5ff);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button.btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--aether-border, rgba(255, 255, 255, 0.12));
      color: var(--aether-text, #f0f0f0);
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-action:hover {
      background: var(--aether-accent, #70a5ff);
      color: #121212;
      border-color: var(--aether-accent, #70a5ff);
    }

    .canvas-container {
      flex: 1;
      position: relative;
      background: #121212;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .canvas-hint {
      position: absolute;
      top: 10px;
      left: 12px;
      font-family: var(--font-mono, monospace);
      font-size: 9px;
      color: var(--aether-text-dim, #888);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      pointer-events: none;
      opacity: 0.7;
    }

    .controls-panel {
      padding: 10px 14px;
      border-top: 1px solid var(--aether-border, rgba(255, 255, 255, 0.12));
      background: rgba(0, 0, 0, 0.25);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .control-label {
      color: var(--aether-text-dim, #888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .control-val {
      color: var(--aether-accent, #70a5ff);
      font-weight: 600;
      margin-left: 4px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--aether-accent, #70a5ff);
      cursor: pointer;
      box-shadow: 0 0 6px var(--aether-accent, #70a5ff);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--aether-accent, #70a5ff);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px var(--aether-accent, #70a5ff);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <span class="title">Kinetic Glitch-Pond</span>
      <div class="status-badge" id="glitch-status">
        <span class="status-dot"></span>
        <span id="status-text">LIVE</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-action" id="btn-clear">Clear Vectors</button>
      <button class="btn-action" id="btn-pulse">Manual Hit</button>
    </div>
  </header>

  <div class="canvas-container" id="container">
    <div class="canvas-hint">Click & Drag to draw vector barriers</div>
    <canvas id="pond"></canvas>
  </div>

  <div class="controls-panel">
    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Attack</span>
        <span class="control-val" id="val-attack">15%</span>
      </div>
      <input type="range" id="param-attack" min="0.00" max="1.00" step="0.01" value="0.15">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Decay</span>
        <span class="control-val" id="val-decay">35%</span>
      </div>
      <input type="range" id="param-decay" min="0.00" max="1.00" step="0.01" value="0.35">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Filter Sweep</span>
        <span class="control-val" id="val-sweep">50%</span>
      </div>
      <input type="range" id="param-sweep" min="0.00" max="1.00" step="0.01" value="0.50">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Speed</span>
        <span class="control-val" id="val-speed">0.50</span>
      </div>
      <input type="range" id="param-speed" min="0.10" max="1.00" step="0.01" value="0.50">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Intensity</span>
        <span class="control-val" id="val-intensity">0.60</span>
      </div>
      <input type="range" id="param-intensity" min="0.00" max="1.00" step="0.01" value="0.60">
    </div>
  </div>

  <script>
    const params = {
      attack: 0.15,
      decay: 0.35,
      filter_sweep: 0.50,
      particle_speed: 0.50,
      glitch_intensity: 0.60
    };

    const canvas = document.getElementById('pond');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const glitchStatus = document.getElementById('glitch-status');

    let width = 0;
    let height = 0;
    let initialized = false;

    // Normalized vector lines store (x1, y1, x2, y2 from 0.0 to 1.0)
    let normalizedVectors = [];

    // Load persisted vectors from storage
    try {
      const saved = localStorage.getItem('aether_kinetic_glitch_pond_vectors');
      if (saved) {
        normalizedVectors = JSON.parse(saved);
      }
    } catch (_) {}

    function saveVectors() {
      try {
        localStorage.setItem('aether_kinetic_glitch_pond_vectors', JSON.stringify(normalizedVectors));
      } catch (_) {}
    }

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 20 && h > 20) {
        width = w;
        height = h;
        canvas.width = width * (window.devicePixelRatio || 1);
        canvas.height = height * (window.devicePixelRatio || 1);
        ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
        if (!initialized) initParticles();
      }
    }
    window.addEventListener('resize', resize);

    function getAccentColor() {
      const style = getComputedStyle(document.documentElement);
      return style.getPropertyValue('--aether-accent').trim() || 
             style.getPropertyValue('--track-color').trim() || '#70a5ff';
    }

    const particles = [];
    function initParticles() {
      if (width <= 50 || height <= 50) return;
      particles.length = 0;
      const NUM_PARTICLES = 4;
      for (let i = 0; i < NUM_PARTICLES; i++) {
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x: 30 + Math.random() * (width - 60),
          y: 30 + Math.random() * (height - 60),
          vx: Math.cos(angle),
          vy: Math.sin(angle),
          radius: 5,
          tail: []
        });
      }
      initialized = true;
    }

    let isDrawing = false;
    let currentLine = null;
    const flashes = [];

    // Jitter-free status indicator pulse with cooldown
    let lastGlitchTime = 0;
    let statusResetTimeout = null;

    function triggerGlitch(x, y) {
      const now = performance.now();
      if (now - lastGlitchTime < 60) return;
      lastGlitchTime = now;

      if (flashes.length < 6) {
        flashes.push({
          x: x || width / 2,
          y: y || height / 2,
          radius: 3,
          alpha: 0.9
        });
      }

      glitchStatus.classList.add('hit');
      if (statusResetTimeout) clearTimeout(statusResetTimeout);
      statusResetTimeout = setTimeout(() => {
        glitchStatus.classList.remove('hit');
      }, 100);

      window.parent.postMessage({ type: 'PARAMETER_CHANGE', id: 'trigger_glitch', value: 1.0 }, '*');
    }

    function emitParam(paramId, value) {
      params[paramId] = value;
      window.parent.postMessage({ type: 'PARAMETER_CHANGE', id: paramId, value: value }, '*');
    }

    function checkSegmentCollision(p, p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return false;

      let t = ((p.x - p1.x) * dx + (p.y - p1.y) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const closeX = p1.x + t * dx;
      const closeY = p1.y + t * dy;
      const distSq = (p.x - closeX) * (p.x - closeX) + (p.y - closeY) * (p.y - closeY);

      if (distSq <= p.radius * p.radius) {
        let nx = p.x - closeX;
        let ny = p.y - closeY;
        let nLen = Math.sqrt(nx * nx + ny * ny);
        if (nLen === 0) {
          nx = -dy;
          ny = dx;
          nLen = Math.sqrt(nx * nx + ny * ny);
        }
        if (nLen === 0) return false;
        nx /= nLen;
        ny /= nLen;

        const dot = p.vx * nx + p.vy * ny;
        if (dot < 0) {
          p.vx = p.vx - 2 * dot * nx;
          p.vy = p.vy - 2 * dot * ny;
          p.x = closeX + nx * (p.radius + 1.5);
          p.y = closeY + ny * (p.radius + 1.5);
          triggerGlitch(closeX, closeY);
          return true;
        }
      }
      return false;
    }

    function render() {
      if (width < 30 || height < 30) {
        resize();
        requestAnimationFrame(render);
        return;
      }

      ctx.fillStyle = '#121212';
      ctx.fillRect(0, 0, width, height);

      const accent = getAccentColor();
      const speedMultiplier = params.particle_speed * 4.0;

      // Draw persisted vector barriers
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);

      normalizedVectors.forEach(norm => {
        ctx.beginPath();
        ctx.moveTo(norm.x1 * width, norm.y1 * height);
        ctx.lineTo(norm.x2 * width, norm.y2 * height);
        ctx.stroke();
      });

      if (currentLine) {
        ctx.strokeStyle = accent;
        ctx.beginPath();
        ctx.moveTo(currentLine.p1.x, currentLine.p1.y);
        ctx.lineTo(currentLine.p2.x, currentLine.p2.y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Update and draw particles
      particles.forEach(p => {
        p.x += p.vx * speedMultiplier;
        p.y += p.vy * speedMultiplier;

        p.tail.push({ x: p.x, y: p.y });
        if (p.tail.length > 6) p.tail.shift();

        // Edge Collisions
        if (p.x - p.radius <= 0) {
          p.x = p.radius + 1;
          p.vx = Math.abs(p.vx);
          triggerGlitch(p.x, p.y);
        } else if (p.x + p.radius >= width) {
          p.x = width - p.radius - 1;
          p.vx = -Math.abs(p.vx);
          triggerGlitch(p.x, p.y);
        }

        if (p.y - p.radius <= 0) {
          p.y = p.radius + 1;
          p.vy = Math.abs(p.vy);
          triggerGlitch(p.x, p.y);
        } else if (p.y + p.radius >= height) {
          p.y = height - p.radius - 1;
          p.vy = -Math.abs(p.vy);
          triggerGlitch(p.x, p.y);
        }

        // Vector collisions
        normalizedVectors.forEach(norm => {
          checkSegmentCollision(p, { x: norm.x1 * width, y: norm.y1 * height }, { x: norm.x2 * width, y: norm.y2 * height });
        });

        // Draw particle tail
        for (let t = 0; t < p.tail.length; t++) {
          const pt = p.tail[t];
          const alpha = ((t + 1) / p.tail.length) * 0.35;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, p.radius * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = accent;
          ctx.globalAlpha = alpha;
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Draw particle
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw collision shockwaves
      for (let f = flashes.length - 1; f >= 0; f--) {
        const flash = flashes[f];
        flash.radius += 1.6;
        flash.alpha *= 0.86;

        ctx.beginPath();
        ctx.arc(flash.x, flash.y, flash.radius, 0, Math.PI * 2);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = flash.alpha;
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        if (flash.alpha < 0.05) {
          flashes.splice(f, 1);
        }
      }

      requestAnimationFrame(render);
    }

    setTimeout(() => {
      resize();
      requestAnimationFrame(render);
    }, 50);

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.max(0, Math.min(width, clientX - rect.left)),
        y: Math.max(0, Math.min(height, clientY - rect.top))
      };
    }

    container.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pt = getCanvasCoords(e);
      currentLine = { p1: pt, p2: pt };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDrawing || !currentLine) return;
      currentLine.p2 = getCanvasCoords(e);
    });

    window.addEventListener('mouseup', () => {
      if (isDrawing && currentLine && width > 0 && height > 0) {
        const dx = currentLine.p2.x - currentLine.p1.x;
        const dy = currentLine.p2.y - currentLine.p1.y;
        if (Math.hypot(dx, dy) > 10) {
          normalizedVectors.push({
            x1: currentLine.p1.x / width,
            y1: currentLine.p1.y / height,
            x2: currentLine.p2.x / width,
            y2: currentLine.p2.y / height
          });
          if (normalizedVectors.length > 8) normalizedVectors.shift();
          saveVectors();
        }
      }
      isDrawing = false;
      currentLine = null;
    });

    // Touch Support
    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const pt = getCanvasCoords(e);
      currentLine = { p1: pt, p2: pt };
    });

    container.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing || !currentLine) return;
      currentLine.p2 = getCanvasCoords(e);
    });

    container.addEventListener('touchend', () => {
      if (isDrawing && currentLine && width > 0 && height > 0) {
        const dx = currentLine.p2.x - currentLine.p1.x;
        const dy = currentLine.p2.y - currentLine.p1.y;
        if (Math.hypot(dx, dy) > 10) {
          normalizedVectors.push({
            x1: currentLine.p1.x / width,
            y1: currentLine.p1.y / height,
            x2: currentLine.p2.x / width,
            y2: currentLine.p2.y / height
          });
          if (normalizedVectors.length > 8) normalizedVectors.shift();
          saveVectors();
        }
      }
      isDrawing = false;
      currentLine = null;
    });

    // Controls
    const attackSlider = document.getElementById('param-attack');
    const attackVal = document.getElementById('val-attack');
    const decaySlider = document.getElementById('param-decay');
    const decayVal = document.getElementById('val-decay');
    const sweepSlider = document.getElementById('param-sweep');
    const sweepVal = document.getElementById('val-sweep');
    const speedSlider = document.getElementById('param-speed');
    const speedVal = document.getElementById('val-speed');
    const intensitySlider = document.getElementById('param-intensity');
    const intensityVal = document.getElementById('val-intensity');

    attackSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      attackVal.textContent = `${Math.round(val * 100)}%`;
      emitParam('attack', val);
    });

    decaySlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      decayVal.textContent = `${Math.round(val * 100)}%`;
      emitParam('decay', val);
    });

    sweepSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sweepVal.textContent = `${Math.round(val * 100)}%`;
      emitParam('filter_sweep', val);
    });

    speedSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      speedVal.textContent = val.toFixed(2);
      emitParam('particle_speed', val);
    });

    intensitySlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      intensityVal.textContent = val.toFixed(2);
      emitParam('glitch_intensity', val);
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      normalizedVectors = [];
      saveVectors();
    });

    document.getElementById('btn-pulse').addEventListener('click', () => {
      triggerGlitch(width / 2, height / 2);
    });

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const { type, paramId, id, value } = event.data;
      const targetId = paramId || id;

      if ((type === 'aether:param-update' || type === 'PARAMETER_UPDATE') && targetId) {
        const num = parseFloat(value);
        if (targetId === 'attack' && !isNaN(num)) {
          params.attack = num;
          attackSlider.value = num;
          attackVal.textContent = `${Math.round(num * 100)}%`;
        } else if (targetId === 'decay' && !isNaN(num)) {
          params.decay = num;
          decaySlider.value = num;
          decayVal.textContent = `${Math.round(num * 100)}%`;
        } else if (targetId === 'filter_sweep' && !isNaN(num)) {
          params.filter_sweep = num;
          sweepSlider.value = num;
          sweepVal.textContent = `${Math.round(num * 100)}%`;
        } else if (targetId === 'particle_speed' && !isNaN(num)) {
          params.particle_speed = num;
          speedSlider.value = num;
          speedVal.textContent = num.toFixed(2);
        } else if (targetId === 'glitch_intensity' && !isNaN(num)) {
          params.glitch_intensity = num;
          intensitySlider.value = num;
          intensityVal.textContent = num.toFixed(2);
        }
      }
    });
  </script>
</body>
</html>
