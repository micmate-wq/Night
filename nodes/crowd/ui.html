<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crowd</title>
  <style>
    :root {
      --bg: var(--aether-bg, var(--bg-main, #0A0A0A));
      --panel: var(--aether-panel, var(--bg-card, #141414));
      --accent: var(--track-color, var(--aether-accent, #FFFFFF));
      --text: var(--aether-text, var(--text-main, #FFFFFF));
      --muted: var(--aether-text-muted, var(--text-muted, #888));
      --border: var(--aether-border, var(--border-light, #333));
      --font-h: var(--aether-font-heading, 'Space Grotesk', sans-serif);
      --font-m: var(--aether-font-mono, 'JetBrains Mono', monospace);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-h); font-size: 11px;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    header {
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    .badge { font-family: var(--font-m); font-size: 9px; opacity: 0.6; letter-spacing: 0.08em; }
    .badge.gather { opacity: 1; color: var(--accent); }
    .field-wrap {
      margin: 10px 12px 0; height: 52px; border: 1px solid var(--border);
      position: relative; overflow: hidden; background: rgba(255,255,255,0.02);
    }
    #field { width: 100%; height: 100%; display: block; }
    .grid { padding: 10px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .val { font-family: var(--font-m); color: var(--text); }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #222; border: 1px solid var(--border); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); cursor: pointer; }
    .status-line {
      padding: 0 12px 10px; font-family: var(--font-m); font-size: 9px;
      color: var(--muted); letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Crowd</div>
    <div class="badge" id="status-badge">IDLE</div>
  </header>
  <div class="field-wrap"><canvas id="field"></canvas></div>
  <div class="grid">
    <label><div class="row"><span>Density</span><span class="val" id="v-density">8</span></div>
      <input id="density" type="range" min="5" max="30" step="1" value="8"></label>
    <label><div class="row"><span>Focus</span><span class="val" id="v-focus">0.35</span></div>
      <input id="focus" type="range" min="0" max="1" step="0.01" value="0.35"></label>
    <label><div class="row"><span>Distance</span><span class="val" id="v-distance">0.55</span></div>
      <input id="distance" type="range" min="0" max="1" step="0.01" value="0.55"></label>
    <label><div class="row"><span>Granular</span><span class="val" id="v-granular">0.15</span></div>
      <input id="granular" type="range" min="0" max="1" step="0.01" value="0.15"></label>
    <label><div class="row"><span>Chatter</span><span class="val" id="v-chatter">0.40</span></div>
      <input id="chatter" type="range" min="0" max="1" step="0.01" value="0.4"></label>
    <label><div class="row"><span>Wander</span><span class="val" id="v-wander">0.30</span></div>
      <input id="wander" type="range" min="0" max="1" step="0.01" value="0.3"></label>
  </div>
  <div class="status-line" id="status-line">crowd is idle</div>
  <script>
    const state = { density: 8, focus: 0.35, distance: 0.55, granular: 0.15, chatter: 0.4, wander: 0.3 };
    const badge = document.getElementById('status-badge');
    const statusLine = document.getElementById('status-line');
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    let uiStatus = 'idle';
    let t0 = performance.now();
    const particles = [];
    const segments = [];

    function notify(id, value) {
      window.parent.postMessage({ type: 'aether:param-change', paramId: id, value: value }, '*');
    }

    function focusClear() {
      return state.focus * 5.5;
    }

    function fmt(id, n) {
      if (id === 'density') return String(Math.round(n));
      return Number(n).toFixed(2);
    }

    function bind(id) {
      const el = document.getElementById(id);
      const v = document.getElementById('v-' + id);
      el.addEventListener('input', () => {
        const n = parseFloat(el.value);
        state[id] = n;
        v.textContent = fmt(id, n);
        syncParticles();
        notify(id, n);
      });
    }
    ['density', 'focus', 'distance', 'granular', 'chatter', 'wander'].forEach(bind);

    function setStatus(s, detail) {
      uiStatus = s || 'idle';
      const gathering = uiStatus === 'gathering';
      badge.classList.toggle('gather', gathering);
      if (gathering) {
        badge.textContent = 'GATHERING';
        const ready = detail && detail.ready != null ? detail.ready : '?';
        statusLine.textContent = 'crowd is gathering… ' + ready + ' / ' + Math.min(16, Math.round(state.density));
      } else if (uiStatus === 'ready') {
        badge.textContent = 'READY';
        statusLine.textContent = 'sounding ~' + Math.round(state.density) + ' · clear ~' + focusClear().toFixed(1);
      } else if (uiStatus === 'fetch-failed') {
        badge.textContent = 'NO PACK';
        statusLine.textContent = 'atlas fetch failed — inject buffers or retry';
      } else {
        badge.textContent = 'IDLE';
        statusLine.textContent = 'crowd is idle · David pack on play';
      }
    }

    function resize() {
      const wrap = canvas.parentElement;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function syncParticles() {
      const n = Math.round(state.density);
      const grainExtra = Math.round(state.granular * 18);
      const target = n + grainExtra;
      while (particles.length < target) {
        particles.push({
          x: Math.random(), y: Math.random(),
          vx: (Math.random() - 0.5) * 0.004,
          vy: (Math.random() - 0.5) * 0.004,
          life: Math.random(),
          size: 1.2 + Math.random() * 2.4,
          phase: Math.random() * Math.PI * 2
        });
      }
      while (particles.length > target) particles.pop();
      const segN = Math.round(4 + state.density * 0.35 + state.granular * 10);
      while (segments.length < segN) {
        segments.push({
          a: Math.random() * Math.PI * 2,
          len: 0.04 + Math.random() * 0.12,
          r: 0.15 + Math.random() * 0.35,
          spin: (Math.random() - 0.5) * 0.04,
          phase: Math.random() * Math.PI * 2
        });
      }
      while (segments.length > segN) segments.pop();
    }

    function paint() {
      const wrap = canvas.parentElement;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      const now = (performance.now() - t0) / 1000;
      const density = state.density;
      const gran = state.granular;
      const chatter = state.chatter;
      const clearN = focusClear();
      const dist = state.distance;
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#fff';

      ctx.clearRect(0, 0, w, h);

      // Busy segment arcs — granular / chatter driven
      const cx = w * 0.5, cy = h * 0.5;
      const activity = 0.35 + density / 30 + gran * 0.8 + chatter * 0.4;
      for (let i = 0; i < segments.length; i++) {
        const s = segments[i];
        s.a += s.spin * (0.6 + chatter * 1.4 + gran * 0.8);
        const jitter = Math.sin(now * (8 + gran * 14) + s.phase) * gran * 0.08;
        const rr = Math.min(w, h) * (s.r + jitter);
        const span = s.len * (0.7 + activity);
        ctx.beginPath();
        ctx.arc(cx, cy, rr, s.a, s.a + span * Math.PI * 2);
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.12 + gran * 0.35 + (i % 3 === 0 ? 0.1 : 0);
        ctx.lineWidth = 1 + gran * 1.5;
        ctx.stroke();
      }

      // Voice particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const isClear = i < clearN;
        const speed = (0.0015 + chatter * 0.004 + gran * 0.003) * (isClear ? 0.6 : 1.2);
        p.x += p.vx + Math.sin(now * 3 + p.phase) * speed;
        p.y += p.vy + Math.cos(now * 2.4 + p.phase * 1.3) * speed * 0.85;
        // wander drift
        p.vx += (Math.random() - 0.5) * state.wander * 0.0008;
        p.vy += (Math.random() - 0.5) * state.wander * 0.0008;
        p.vx *= 0.98; p.vy *= 0.98;
        if (p.x < 0.02 || p.x > 0.98) p.vx *= -1;
        if (p.y < 0.08 || p.y > 0.92) p.vy *= -1;
        p.x = Math.max(0.02, Math.min(0.98, p.x));
        p.y = Math.max(0.08, Math.min(0.92, p.y));

        // granular spark bursts
        if (gran > 0.2 && Math.random() < gran * 0.04) {
          p.life = 1;
          p.size = 1 + Math.random() * (2 + gran * 3);
        }
        p.life *= 0.97;

        const px = p.x * w;
        const py = p.y * h;
        const r = p.size * (isClear ? 1.35 : 0.85) * (uiStatus === 'gathering' ? (0.7 + 0.4 * Math.sin(now * 6 + i)) : 1);
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        if (isClear) {
          ctx.globalAlpha = 0.85 + p.life * 0.15;
        } else {
          ctx.globalAlpha = (0.14 + (1 - dist) * 0.22) * (0.6 + p.life * 0.4);
        }
        ctx.fill();

        // micro segment trails when granular
        if (gran > 0.25 && !isClear) {
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px - p.vx * w * 18, py - p.vy * h * 18);
          ctx.strokeStyle = accent;
          ctx.globalAlpha = 0.08 + gran * 0.2;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    function tick() {
      paint();
      requestAnimationFrame(tick);
    }

    resize();
    syncParticles();
    setStatus('idle');
    requestAnimationFrame(tick);
    window.addEventListener('resize', () => { resize(); });

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'aether:param-update') {
        const { paramId, value } = event.data;
        if (state[paramId] === undefined) return;
        state[paramId] = value;
        const el = document.getElementById(paramId);
        const v = document.getElementById('v-' + paramId);
        if (el) el.value = value;
        if (v) v.textContent = fmt(paramId, Number(value));
        syncParticles();
      }
      if (event.data.type === 'aether:crowd-status') {
        setStatus(event.data.status, event.data);
      }
      if (event.data.type === 'aether:transport' && event.data.playing) {
        if (uiStatus === 'idle') setStatus('gathering', { ready: 0 });
      }
      if (event.data.type === 'aether:transport' && event.data.playing === false) {
        setStatus('idle');
      }
    });
  </script>
</body>
</html>
